<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Get in touch with Wild Wave Crew. Find our address, phone number,
    email and map, meet our team, and send us a message about trips and reservations.">
    <meta name="author" content="Moroni Silva">
    <title>Wild Wave Crew | Contact us page</title>
    <link rel="stylesheet" href="styles/rafting.css">


</head>


<body>
    <header>
        <img src="images/rafting-logo.png" alt="logo showing a group of people in a raft on river rapids" class="logo">


        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero contact-hero">
            <h1>Wild Wave Crew</h1>
        </div>
        <div class="contact-layout">
            <section class="contact-info">
                <p>123 main river street</p>
                <p>kolob, california</p>
                <p>+1 999 999 9999</p>
                <p>info@whitewater.com</p>
            </section>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3223.7748955995658!2d-82.43192599999999!3d36.098974999999996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x885a6dcd5521040f%3A0x202d01c4ef5c3fec!2sUSA%20Raft%20Adventure%20Resort!5e0!3m2!1spt-PT!2spt!4v1790979125070!5m2!1spt-PT!2spt"
                width="600" height="450" allowfullscreen="" loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <form class="contact-form">


                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>


                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail" required>


                <fieldset>
                    <legend>Message purpose</legend>


                    <input type="radio" id="general" name="purpose" value="general" required>
                    <label for="general">General Inquiry</label>


                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    <label for="reservation">Reservation Question</label>


                    <input type="radio" id="suggestion" name="purpose" value="suggestion">
                    <label for="suggestion">Website Suggestion</label>
                </fieldset>


                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Type here" required></textarea>


                <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                <input type="checkbox" id="newsletter" name="newsletter">
                <button type="submit">Get in touch</button>


            </form>
        </div>
        <section class="team">
            <h2>Meet our Team</h2>
            <div class="adventure-grid">
                <figure>
                    <img src="images/pavel.jpg" alt="Laura's employee picture">
                    <figcaption>Laura - Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/Menworker.jpg" alt="David's employee picture">
                    <figcaption>David - Safety Coordinator</figcaption>
                </figure>
                <figure>
                    <img src="images/coordinator.jpg" alt="Silvia's employee picture">
                    <figcaption>Silvia - Trip Manager</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>©2026, Wild Wave Crew, Moroni Silva </p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-icon.svg" alt="Facebook Icon"> </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-icon.svg" alt="Linkedin Icon"> </a>
            <a href="https://instagram.com">
                <img src="images/instagram-icon.svg" alt="Instagram Icon">
            </a>
        </nav>


    </footer>
</body>


</html>
